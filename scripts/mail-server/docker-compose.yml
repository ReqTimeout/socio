---
services:
  mail:
    image: mailserver/docker-mailserver:14
    container_name: mailserver
    hostname: mail
    domainname: socio.id
    environment:
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=0
      - ENABLE_FAIL2BAN=1
      - ENABLE_SASLAUTHD=1
      - TLS_PERMISSIVE=1
      - PERMIT_DOCKER=host
      - SMTP_ONLY=0
      - SSL_TYPE=custom
    ports:
      - "25:25"
      - "587:587"
      - "465:465"
    volumes:
      - ./mail-data/:/var/mail/
      - ./mail-state/:/var/mail-state/
      - ./mail-config/:/tmp/docker-mailserver/
      - ./config/:/etc/dms/
      - /etc/localtime:/etc/localtime:ro
      # Bind-mount dovecot socket directly (postfix chroot can read it)
      - /run/dovecot/auth-client:/var/spool/postfix/run/dovecot/auth-client:rw
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"